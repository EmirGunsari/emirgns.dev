<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasımpatı - Sinem'e</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="bouquet-wrapper">
            <div class="bouquet-wrap-back"></div>
            <div id="bouquet" class="bouquet">
                <!-- Flowers will be generated here -->
            </div>
            <div class="bouquet-wrap-front"></div>
            <div class="ribbon">
                <div class="ribbon-left"></div>
                <div class="ribbon-right"></div>
                <div class="ribbon-center"></div>
            </div>
        </div>
        <div class="message">
            <h1>Ne ilk Kasım, Ne ilk kasımpatı.</h1>
            <h1>Ne son kasımımız, Ne de son kasımpatın.</h1>
        </div>
        <div class="love-message">
            <p>Sinem seni çok seviyorum ❤️</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
